  name: Selenium Automation Tests

  on:
    push:
      branches: ["main"]
    pull_request:
      branches: ["main"]
    workflow_dispatch:

  jobs:
    selenium-tests:
      runs-on: ubuntu-latest

      steps:
        - name: Download project
          uses: actions/checkout@v4

        - name: Set up Java
          uses: actions/setup-java@v4
          with:
            distribution: temurin
            java-version: "21"
            cache: maven

        - name: Run CI Selenium tests
          run: mvn -B clean test -Dci_cd=true
